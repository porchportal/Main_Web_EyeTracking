services:
  nginx_website:
    image: nginx:1.28.0-alpine
    container_name:  main-website_backend_nginx
    # nginx needs root to bind to privileged ports, but drops privileges for workers
    # External access ports - using localhost for local development
    ports:
      - "9080:9080"    
      - "9443:9443"    
      - "9444:9444"    
    # Internal ports for Docker communication
    expose:
      - "9080"      # Internal HTTP port
      - "9443"      # Internal HTTPS port
      - "9444"      # Internal camera HTTPS port
    volumes:
      - ./backend/config/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/config/ssl:/etc/nginx/ssl:ro
    depends_on:
      auth_service:
        condition: service_healthy
      image_service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ipuserver_internal_eye
      - nginx_proxy
    restart: unless-stopped
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=512

  image_service:
    build:
      context: ./backend
      dockerfile: image_service/Dockerfile
    container_name:  main-website_backend_image_service
    # No public ports - internal Docker communication only
    expose:
      - "8010"
    env_file:
      - ./backend/.env.backend
    volumes:
      - ./backend/auth_service/resource_security/public/captures:/app/resource_security/public/captures
      - ./backend/auth_service/resource_security/public/enhance:/app/resource_security/public/enhance
      - ./backend/auth_service/resource_security/public/complete:/app/resource_security/public/complete
      - ./backend/Main_AI/Main_model/weight:/app/weights
    environment:
      - PORT=8010
      - IMAGE_SERVICE_URL=http://image_service:8010
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - APP_UID=${HOST_UID:-1000}
      - APP_GID=${HOST_GID:-1000}
    networks:
      - ipuserver_internal_eye
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # video_service:
  #   build: 
  #     context: ./backend
  #     dockerfile: video_service/Dockerfile
  #   container_name: backend_video_service
  #   ports:
  #     - "8011:8011"
  #   environment:
  #     - PORT=8011
  #   networks:
  #     - app-network


  auth_service:
    build:
      context: ./backend
      dockerfile: auth_service/Dockerfile
    container_name:  main-website_backend_auth_service
    # No public ports - internal Docker communication only
    expose:
      - "8108"
    volumes:
      - ./backend/auth_service/resource_security/public/captures:/app/resource_security/public/captures
      - ./backend/auth_service/resource_security/public/enhance:/app/resource_security/public/enhance
      - ./backend/auth_service/resource_security/public/complete:/app/resource_security/public/complete
      - ./backend/auth_service/resource_security/canvas:/app/resource_security/canvas
      - ./backend/auth_service/resource_security/consent_data.json:/app/resource_security/consent_data.json
      - ./backend/auth_service/resource_security/data_centralization:/app/resource_security/data_centralization
      - ./backend/auth_service/resource_security/user_preferences:/app/resource_security/user_preferences
    env_file:
      - ./backend/.env.backend
    environment:
      - APP_UID=${HOST_UID:-1000}
      - APP_GID=${HOST_GID:-1000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ipuserver_internal_eye
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name:  main-website_frontend_main
    # No public ports - internal Docker communication only
    expose:
      - "3010"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.frontend
    depends_on:
      auth_service:
        condition: service_healthy
    networks:
      - ipuserver_internal_eye
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongodb:
    image: mongo:8.0.8
    container_name:  main-website_mongodb
    # mongodb manages its own user privileges via custom entrypoint
    # Expose MongoDB port to localhost for development
    ports:
      - "27017:27017"    # MongoDB access: mongodb://localhost:27017
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/config/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./backend/config/mongod.conf:/etc/mongod.conf:ro
      - ./backend/config/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint-custom.sh:ro
    env_file:
      - ./backend/.env.backend
    entrypoint: ["/usr/local/bin/docker-entrypoint-custom.sh"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ipuserver_internal_eye
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ipuserver_internal_eye:
    name: ipuserver_internal_eye
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.30.0.0/16

  # Network for communication with other Docker containers on the same server
  # Changed from external to auto-created to avoid startup errors
  nginx_proxy:
    name: nginx_proxy
    driver: bridge

volumes:
  mongodb_data: