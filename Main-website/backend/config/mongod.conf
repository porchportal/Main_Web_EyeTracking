# mongod.conf
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Limit cache size to 4GB (adjust based on available memory)
      cacheSizeGB: 4

systemLog:
  # Quiet mode - reduce logging output
  quiet: true
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  verbosity: 0
  component:
    # Reduce network logging
    network:
      verbosity: 0
    # Reduce other component logging
    accessControl:
      verbosity: 0
    command:
      verbosity: 0

net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: disabled

# Note: Authorization is handled by MongoDB Docker entrypoint automatically
# Do NOT enable it here or the init script won't be able to create users

setParameter:
  internalQueryCacheMaxEntriesPerCollection: 1000
  collectionSamplingLogIntervalSeconds: 1
  storageEngineConcurrentReadTransactions: 128
  storageEngineConcurrentWriteTransactions: 128